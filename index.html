<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>IruUyir | Maternal Healthcare & Triage Support</title>
<link rel="stylesheet" href="shared/css/iruuyir.css">
</head>
<body>
<main class="role-page">
  <header class="role-head">
    <!-- LOGO PLACEHOLDER: replace this div's content with <img src="shared/assets/logo.png" alt="IruUyir"> -->

    <h1>IruUyir</h1>
    <p class="muted">Maternal Healthcare &amp; Triage Support</p>
